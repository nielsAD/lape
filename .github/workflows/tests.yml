name: tests

on: [push, pull_request]

jobs:
  tests:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: windows-2025
            name: Windows 64
            ffi: default default-static
            fpclazup-url: https://github.com/LongDirtyAnimAlf/Reiniero-fpcup/releases/download/v.2.4.0k/fpclazup-x86_64-win64.exe
            fpclazup-lazcommit: 62c14a4d18c81f222127d42ce9b89b922c63fcbf # 4.8
            fpclazup-fpccommit: 2a105860ee8a8687f3c66918b3441469c0370db4 # 3.2.4 RC2

          - os: windows-2025
            name: Windows 32
            ffi: stdcall cdecl pascal register stdcall-static cdecl-static pascal-static register-static
            fpclazup-url: https://github.com/LongDirtyAnimAlf/Reiniero-fpcup/releases/download/v.2.4.0k/fpclazup-i386-win32.exe
            fpclazup-lazcommit: 62c14a4d18c81f222127d42ce9b89b922c63fcbf # 4.8
            fpclazup-fpccommit: 2a105860ee8a8687f3c66918b3441469c0370db4 # 3.2.4 RC2

          - os: ubuntu-24.04
            name: Linux 64
            ffi: default
            fpclazup-url: https://github.com/LongDirtyAnimAlf/Reiniero-fpcup/releases/download/v.2.4.0k/fpclazup-x86_64-linux
            fpclazup-lazcommit: 62c14a4d18c81f222127d42ce9b89b922c63fcbf # 4.8
            fpclazup-fpccommit: 2a105860ee8a8687f3c66918b3441469c0370db4 # 3.2.4 RC2

          - os: macos-26-intel
            name: Mac
            ffi: default
            fpclazup-url: https://github.com/LongDirtyAnimAlf/Reiniero-fpcup/releases/download/v.2.4.0k/fpclazup-x86_64-darwin
            fpclazup-lazcommit: 62c14a4d18c81f222127d42ce9b89b922c63fcbf # 4.8
            fpclazup-fpccommit: aa8050f30ce7a23f8881de844c07c0f17033409e # trunk (~3.3)

          - os: macos-26
            name: Mac Arm
            ffi: ''
            fpclazup-url: https://github.com/LongDirtyAnimAlf/Reiniero-fpcup/releases/download/v.2.4.0k/fpclazup-aarch64-darwin
            fpclazup-lazcommit: 62c14a4d18c81f222127d42ce9b89b922c63fcbf # 4.8
            fpclazup-fpccommit: aa8050f30ce7a23f8881de844c07c0f17033409e # trunk (~3.3)

    steps:
      - uses: actions/checkout@v7.0.1
      
      - name: Use Xcode's SDK
        if: runner.os == 'macOS'
        run: |
          ls -la /Library/Developer/CommandLineTools/SDKs/
          sudo ln -sfn "$(xcrun --sdk macosx --show-sdk-path)" /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
          ls -la /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk

      - name: Install Lazarus
        uses: ollydev/setup-lazarus@v4.2
        with:
          fpclazup-url: ${{ matrix.config.fpclazup-url }}
          fpclazup-lazcommit: ${{ matrix.config.fpclazup-lazcommit }}
          fpclazup-fpccommit: ${{ matrix.config.fpclazup-fpccommit }}
      
      - name: Test Lape
        run: |
          lazbuild package/lape.lpk
          lazbuild tests/RunTests/LapeTest.lpi
          
          cd tests/RunTests/ && ./LapeTest

      - name: Test Lape FFI
        if: ${{ matrix.config.ffi != '' }}
        run: |
          cd extensions/ffi/test/

          error=0
          for BUILD_MODE in ${{ matrix.config.ffi }}
          do
            lazbuild LapeTestFFI.lpi --build-mode=$BUILD_MODE || error=1
            ./LapeTestFFI || error=1
          done

          exit $error